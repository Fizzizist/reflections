name: Release

on:
  push:
    branches:
      - trunk

env:
  CARGO_TERM_COLOR: always
  RELEASES_URL_PATH: releases/reflections

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check version
        id: check
        run: |
          result=$(packaging/scripts/check-version.sh Cargo.toml .)
          echo "should_release=$(echo "$result" | grep should_release | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "version=$(echo "$result" | grep '^version=' | cut -d= -f2)" >> $GITHUB_OUTPUT

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Synthesize google_secrets.json
        run: echo '{"client_id":"${{ secrets.GOOGLE_CLIENT_ID }}","client_secret":"${{ secrets.GOOGLE_CLIENT_SECRET }}"}' > google_secrets.json

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/reflect

      - name: Create tarball
        run: tar czf reflections-v${{ needs.check-version.outputs.version }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release reflect

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reflections-v${{ needs.check-version.outputs.version }}-${{ matrix.target }}
          path: reflections-v${{ needs.check-version.outputs.version }}-${{ matrix.target }}.tar.gz

  publish:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Verify artifacts
        run: |
          if ! ls artifacts/*.tar.gz 1>/dev/null 2>&1; then
            echo "Error: No tarball artifacts found" >&2
            exit 1
          fi

      - name: Compute SHA256
        id: sha
        run: echo "aarch64=$(sha256sum artifacts/reflections-v${{ needs.check-version.outputs.version }}-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git tag v${{ needs.check-version.outputs.version }}
          git push origin v${{ needs.check-version.outputs.version }}

      - name: Upload to peter.vlasveld.info
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: packaging/scripts/sync-artifacts.sh artifacts/reflections-v${{ needs.check-version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz artifacts/reflections-v${{ needs.check-version.outputs.version }}-aarch64-apple-darwin.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          BASE_URL="https://${DEPLOY_HOST}/${RELEASES_URL_PATH#/}"
          BASE_URL="${BASE_URL%/}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "## Downloads

          - [Linux x86_64](${BASE_URL}/reflections-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz)
          - [macOS aarch64](${BASE_URL}/reflections-v${VERSION}-aarch64-apple-darwin.tar.gz)"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: packaging/scripts/update-homebrew.sh ${{ needs.check-version.outputs.version }} ${{ steps.sha.outputs.aarch64 }}
