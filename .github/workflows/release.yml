name: Release

on:
  push:
    branches: ["trunk"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version delta
        id: check
        run: |
          output=$(bash packaging/scripts/check-version.sh)
          should_release=$(echo "$output" | grep '^should_release=' | cut -d= -f2)
          version=$(echo "$output" | grep '^version=' | cut -d= -f2)
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version, should_release: $should_release"

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Synthesize google_secrets.json
        run: |
          cat > google_secrets.json <<EOF
          {"client_id":"${{ secrets.GOOGLE_CLIENT_ID }}","client_secret":"${{ secrets.GOOGLE_CLIENT_SECRET }}"}
          EOF
      - name: Build
        run: cargo build --release
      - name: Strip binary
        run: strip target/release/reflect
      - name: Archive
        run: |
          tar -czf reflections-v${VERSION}-${{ matrix.target }}.tar.gz \
            -C target/release reflect
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reflections-v${VERSION}-${{ matrix.target }}
          path: reflections-v${VERSION}-${{ matrix.target }}.tar.gz

  publish:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create git tag
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag "v${VERSION}" || echo "Tag already exists"
          git push origin "v${VERSION}" || echo "Tag already pushed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: artifacts/*.tar.gz

      - name: Upload artifacts to deploy host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          for tarball in artifacts/*.tar.gz; do
            bash packaging/scripts/sync-artifacts.sh "$tarball"
          done

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          bash packaging/scripts/update-homebrew.sh \
            "$VERSION" \
            "artifacts/reflections-v${VERSION}-aarch64-apple-darwin.tar.gz" \
            "packaging/homebrew/reflections-bin.rb"