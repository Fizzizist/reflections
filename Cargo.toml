[package]
name = "reflections"
version = "1.6.4"
edition = "2024"
description = "A work journaling app with TUI and CLI"
license = "MIT"
repository = "https://github.com/Fizzizist/reflections"
homepage = "https://github.com/Fizzizist/reflections"

[[bin]]
name = "reflect"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
diff = "0.1.13"
dirs = "6.0.0"
futures = "0.3.32"
hjkl-splash = "0.32.0"
insta = "1.48.0"
open = "5.3.6"
ratatui = "0.30.2"
regex = "1.12.4"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
syntect = "5.3.0"
syntect-assets = "0.23.6"
the-other-tui-markdown = { git = "https://github.com/Fizzizist/the-other-tui-markdown.git", branch = "main", version = "0.1.0" }
tokio = { version = "1.52.3", features = ["full"] }
turso = "0.6.1"
urlencoding = "2.1.3"
uuid = { version = "1.23.3", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
serde_json = "1.0.150"
