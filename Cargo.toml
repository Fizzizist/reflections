[package]
name = "reflections"
version = "0.9.0"
edition = "2024"

[[bin]]
name = "reflect"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
hjkl-splash = "0.32.0"
insta = "1.48.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
turso = "0.6.1"
uuid = { version = "1.23.3", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
