[package]
name = "reflections"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "reflect"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
hjkl-splash = "0.32.0"
insta = "1.48.0"
ratatui = "0.30.2"
tokio = { version = "1.52.3", features = ["full"] }
